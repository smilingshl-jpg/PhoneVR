name: PhoneVR 6DoF APK

# Slim build for the 6DoF fork: only the noGvr debug APK (what the phone needs), not the Windows
# PVR server or the legacy GVR flavour. Steps follow upstream build.yml's Build_APK job.

on:
  push:
    branches: [ sixdof ]
  workflow_dispatch:

env:
  GRADLE_DIR: code/mobile/android/PhoneVR

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Version label
        id: vars
        run: echo "label=$(git rev-parse --short HEAD)-$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      # ALVR v20.8.0 + its Cargo.lock are from May 2024: build with the Rust of that time
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: '1.78.0'
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ${{ env.GRADLE_DIR }}/ALVR/

      - uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: ${{ env.GRADLE_DIR }}

      - name: Prepare deps (pinned Rust tools + Cardboard SDK)
        run: |
          cd $GRADLE_DIR
          bash prepare-sixdof-deps.sh

      - name: Format Java/Kotlin (spotless check runs before every build)
        run: |
          cd $GRADLE_DIR
          chmod +x ./gradlew
          ./gradlew spotlessApply

      - name: Native unit tests (pose maths)
        run: |
          cd $GRADLE_DIR/app/src/test/cpp
          if [ -f run_tests.sh ]; then bash run_tests.sh; else echo "no native tests yet"; fi

      - name: Build noGvr debug APK
        run: |
          cd $GRADLE_DIR
          set -o pipefail
          ./gradlew :app:assembleNoGvrDebug --warning-mode=all --stacktrace 2>&1 | tee build.log

      # Job logs need a GitHub login to read, annotations don't: surface the real errors there.
      - name: Report build errors as annotations
        if: failure()
        run: |
          cd $GRADLE_DIR
          [ -f build.log ] || exit 0
          grep -nE "error:|error\[|FAILED|What went wrong|Caused by|Could not|not found|undefined reference|cannot find" build.log \
            | grep -v "warning:" | head -40 > errors.txt || true
          grep -n -A12 "What went wrong" build.log | head -40 >> errors.txt || true
          i=0
          while IFS= read -r line && [ $i -lt 9 ]; do
            echo "::error title=build::$(echo "$line" | cut -c1-900 | sed 's/%/%25/g')"
            i=$((i+1))
          done < errors.txt
          echo "::error title=build-what-went-wrong::$(grep -A12 'What went wrong' build.log | head -14 | tr '\n' ' ' | cut -c1-2500 | sed 's/%/%25/g')"

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneVR-6DoF-${{ steps.vars.outputs.label }}
          path: ${{ env.GRADLE_DIR }}/app/build/outputs/apk/noGvr/debug/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-files-${{ steps.vars.outputs.label }}
          path: ${{ env.GRADLE_DIR }}/app/.cxx/
